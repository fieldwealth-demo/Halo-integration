<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <title>Advisor Dashboard · Field Shadcn</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <style>
    html, body { margin:0; padding:0; color: rgb(249,250,251); min-height:100vh; font-family: Inter, sans-serif; }
    body { background-color: rgb(14,26,42); background-image: var(--app-bg-image); background-attachment: fixed; }
    * { font-family: Inter, sans-serif !important; }
    /* Font Awesome must win over the global Inter override */
    i.fa, i.fas, i.far, i.fab, i.fa-solid, i.fa-regular, i.fa-brands,
    i.fa::before, i.fas::before, i.far::before, i.fab::before,
    i.fa-solid::before, i.fa-regular::before, i.fa-brands::before {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
    }
    i.fa-brands, i.fab, i.fa-brands::before, i.fab::before { font-family: "Font Awesome 6 Brands" !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes sbTipIn { from { opacity: 0; transform: translateY(-50%) translateX(-4px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } }
    @keyframes sbFlyoutIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
    /* Sidebar tooltip (collapsed) */
    .sb-item { position: relative; }
    .sb-item[data-tip]::after {
      content: attr(data-tip);
      position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%) translateX(-4px);
      background: rgb(17,24,39); color: rgb(249,250,251);
      border: 1px solid rgb(75,85,99); border-radius: 6px;
      padding: 4px 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 6px 16px -4px rgba(0,0,0,0.5); z-index: 60;
    }
    .sb-item[data-tip]:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
    .adv-grid { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; grid-auto-flow: row; align-items: stretch; }
    .adv-grid > * { align-self: stretch; }
    /* --- Edit-mode tile wrapper --- */
    .edit-tile { position:relative; transition: outline-color 150ms ease, transform 150ms ease, opacity 150ms ease; }
    .edit-tile.is-editing { outline: 1px dashed rgba(75,85,99,0.7); outline-offset: 4px; border-radius: 14px; cursor: grab; }
    .edit-tile.is-editing:hover { outline-color: rgb(5,122,85); }
    .edit-tile.is-dragging { opacity: 0.4; }
    .edit-tile.drop-target { outline: 2px solid rgb(5,122,85); outline-offset: 4px; }
    @keyframes edit-shake {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(-0.35deg); }
      75% { transform: rotate(0.35deg); }
    }
    .edit-tile.is-editing > * { animation: edit-shake 2.6s ease-in-out infinite; }
    .edit-tile.is-editing > .edit-menu-wrap,
    .edit-tile.is-editing > .ai-drawer,
    .edit-tile.is-editing > .ai-drawer-backdrop { animation: none; }
    /* Hide the original in-header ellipsis — replaced by our own ellipsis +
       dropdown (idle state) and inline edit/delete actions (Edit-Dashboard
       mode). The Tile component sets display:inline-flex inline so we need
       !important here. */
    .tile-overflow-btn { display: none !important; }
    /* Info icon (data provenance) next to each tile title */
    .tile-info-btn:hover { color: rgb(94,214,164) !important; }
    /* Inline action icons / ellipsis (overlay where the original ellipsis lives) */
    .edit-menu-wrap {
      position: absolute; top: 10px; right: 12px; z-index: 6;
      display: inline-flex; align-items: center; gap: 2px;
    }
    /* Idle ellipsis fades up subtly only on hover so unhovered tiles stay
       calm; in edit mode the action icons are always visible. */
    .edit-tile:not(.is-editing) .edit-menu-wrap { opacity: 0.85; transition: opacity 120ms ease; }
    .edit-tile:not(.is-editing):hover .edit-menu-wrap { opacity: 1; }
    .edit-tile.is-editing .edit-menu-wrap { opacity: 1; }
    .edit-menu-btn {
      width: 26px; height: 26px; border-radius: 6px;
      background: transparent; border: none;
      color: rgb(163,163,163); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      position: relative;
    }
    .edit-menu-btn:hover { color: rgb(249,250,251); background: rgba(255,255,255,0.06); }
    .edit-menu-btn.move-btn { cursor: grab; }
    .edit-menu-btn.move-btn:active { cursor: grabbing; }
    .edit-menu-btn.danger:hover { color: rgb(248,113,113); background: rgba(220,38,38,0.15); }
    .edit-menu-btn.ai:hover { color: rgb(110,231,183); background: rgba(5,122,85,0.18); }
    /* Tooltip */
    .edit-menu-btn[data-tip]::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%) translateY(4px);
      background: rgb(17,24,39); color: rgb(249,250,251);
      border: 1px solid rgb(75,85,99); border-radius: 6px;
      padding: 3px 7px; font-size: 11px; font-weight: 500; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 6px 16px -4px rgba(0,0,0,0.5); z-index: 70;
    }
    .edit-menu-btn[data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* Dropdown */
    .edit-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
      min-width: 160px; padding: 6px; border-radius: 10px;
      background: rgb(17,24,39); border: 1px solid rgb(75,85,99);
      box-shadow: 0 18px 40px -12px rgba(0,0,0,0.7);
      font-family: Inter; font-size: 12.5px; color: rgb(249,250,251);
    }
    .edit-menu-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 7px 10px; border-radius: 6px;
      background: transparent; border: none; color: inherit;
      font-family: inherit; font-size: inherit; cursor: pointer; text-align: left;
    }
    .edit-menu-item:hover { background: rgba(255,255,255,0.06); }
    .edit-menu-item.danger { color: rgb(248,113,113); }
    .edit-menu-item.danger:hover { background: rgba(220,38,38,0.15); }
    .edit-menu-item .mi-ic { width: 14px; display: inline-flex; align-items: center; justify-content: center; color: rgb(163,163,163); }
    .edit-menu-item.danger .mi-ic { color: rgb(248,113,113); }
    .edit-menu-item.move-item { cursor: grab; }
    .edit-menu-item.move-item:active { cursor: grabbing; }
    /* AI edit slide-out drawer (right side) */
    .ai-drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      opacity: 0; pointer-events: none; transition: opacity 180ms ease; z-index: 90;
    }
    .ai-drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .ai-drawer {
      position: fixed; top: 0; right: 0; height: 100vh; width: 400px; max-width: min(92vw, 400px);
      background: rgb(17,24,39); border-left: 1px solid rgb(75,85,99);
      box-shadow: -20px 0 60px -20px rgba(0,0,0,0.7);
      transform: translateX(100%); transition: transform 240ms cubic-bezier(.2,.8,.2,1);
      z-index: 95; display: flex; flex-direction: column;
      box-sizing: border-box;
    }
    .ai-drawer * { box-sizing: border-box; }
    .ai-drawer.open { transform: translateX(0); }
    .ai-drawer-head { padding: 16px 18px; border-bottom: 1px solid rgba(75,85,99,0.5); display: flex; align-items: center; gap: 10px; }
    .ai-drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .ai-drawer-foot { padding: 12px 18px 16px; border-top: 1px solid rgba(75,85,99,0.5); display: flex; align-items: center; gap: 10px; }
    .ai-prompt-chip {
      text-align: left; padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(75,85,99,0.5);
      color: rgb(209,213,219); font-family: Inter; font-size: 12.5px; cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .ai-prompt-chip:hover { background: rgba(5,122,85,0.12); border-color: rgb(5,122,85); color: rgb(249,250,251); }
    .cd-sidebar-scroll::-webkit-scrollbar { width:6px; }
    .cd-sidebar-scroll::-webkit-scrollbar-track { background:transparent; }
    .cd-sidebar-scroll::-webkit-scrollbar-thumb { background:rgba(75,85,99,0.6); border-radius:9999px; }
    .cd-sidebar-scroll::-webkit-scrollbar-thumb:hover { background:rgba(107,114,128,0.8); }
    .cd-sidebar-scroll { scrollbar-width:thin; scrollbar-color:rgba(75,85,99,0.6) transparent; }
    .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; }
    .col-5 { grid-column: span 5; } .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; } .col-8 { grid-column: span 8; }
    .col-12 { grid-column: 1 / -1; }
    /* Explicit row assignment prevents tall tiles from stealing width on the next row */
    .row-1 { grid-row: 1; } .row-2 { grid-row: 2; } .row-3 { grid-row: 3; }
    .row-4 { grid-row: 4; } .row-5 { grid-row: 5; } .row-6 { grid-row: 6; }
  </style>

  <style>
    /* The page-wide icon shim renders Lucide-style SVG masks for fa-* classes
       via background-color + mask-image on ::before. Inside the canonical
       <Sidebar>/<Topbar>, we want real Font Awesome glyphs instead — disable
       only the mask + background bits and let FA inject its own ::before
       content normally. */
    aside i[class*="fa-"]::before,
    header i[class*="fa-"]::before {
      -webkit-mask-image: none !important; mask-image: none !important;
      background-color: transparent !important;
      width: auto !important;
      height: auto !important;
      display: inline !important;
    }
    /* The shim hard-codes content:"" on every fa-*::before, which beats FA's
       external stylesheet. Restore the right glyph for the icons we use in
       the chrome (sidebar + topbar). Codepoints from FA6 Free Solid. */
    aside i.fa-bars::before,          header i.fa-bars::before          { content: "\f0c9 " !important; }
    aside i.fa-table-columns::before, header i.fa-table-columns::before { content: "\f0db " !important; }
    aside i.fa-users::before,         header i.fa-users::before         { content: "\f0c0 " !important; }
    aside i.fa-bell::before,          header i.fa-bell::before          { content: "\f0f3 " !important; }
    aside i.fa-briefcase::before,     header i.fa-briefcase::before     { content: "\f0b1 " !important; }
    aside i.fa-angles-left::before,   header i.fa-angles-left::before   { content: "\f100 " !important; }
    aside i.fa-angles-right::before,  header i.fa-angles-right::before  { content: "\f101 " !important; }
    aside i.fa-magnifying-glass::before, header i.fa-magnifying-glass::before { content: "\f002 " !important; }

<body>
  <div id="root"></div>
  <script type="text/babel" src="ui_kits/shadcn/faCls.jsx"></script>

  <script type="text/babel" src="advisor/MyPracticeAssets.jsx"></script>
  <script type="text/babel" src="advisor/MyPractice.jsx"></script>
  <script type="text/babel" src="advisor/RebalanceFlow.jsx"></script>
  <script type="text/babel" src="advisor/InsightsPage.jsx"></script>
  <script type="text/babel" src="advisor/InsightProposalFlow.jsx"></script>
  <script type="text/babel" src="advisor/HaloGuidedFlow.jsx"></script>

  <script type="text/babel" src="advisor/AdvisorAIPage.jsx"></script>
  <script type="text/babel">
    function App() {
      const nav = [
        { id:'assistant',     label:'Field AI',      icon:'wand-magic-sparkles' },
        { id:'dashboard',     label:'Dashboard',     icon:'table-columns' },
        { id:'clients',       label:'Clients',       icon:'users' },
        { id:'notifications', label:'Notifications', icon:'bell',          badge:1 },
        { id:'insights',      label:'Insights',      icon:'lightbulb' },
        { id:'practice',      label:'My Practice',   icon:'briefcase', children: [
          { id:'practice.clients',  label:'Client Analysis' },
          { id:'practice.cashflow', label:'Cash Flow' },
          { id:'practice.assets',   label:'Assets' },
        ] },
      ];
      const NAV_FOOTER = [
        { id:'settings', label:'Settings',       icon:'gear' },
        { id:'help',     label:'Help & support', icon:'circle-question' },
      ];
      const [active, setActive] = React.useState('assistant');
      const [selectedClient, setSelectedClient] = React.useState(null);
      const [highlightOpp, setHighlightOpp] = React.useState(null);
      const [sbWidth, setSbWidth] = React.useState(56);
      // Highcharts only reflows on window resize — nudge it when the sidebar width settles.
      React.useEffect(() => { const t = setTimeout(() => window.dispatchEvent(new Event('resize')), 280); return () => clearTimeout(t); }, [sbWidth]);
      const [connectionsOpen, setConnectionsOpen] = React.useState(false);
      const [connTick, setConnTick] = React.useState(0);
      const connections = React.useMemo(() => {
        try { return JSON.parse(localStorage.getItem('field.connections') || '{}'); } catch (e) { return {}; }
      }, [connectionsOpen, connTick]);
      const connectedCount = Object.values(connections).filter(c => c && c.status === 'connected').length;
      const totalIntegrations = 6;
      const [tcOpen, setTcOpen] = React.useState(false);
      const [tbOpen, setTbOpen] = React.useState(false);
      const [editTile, setEditTile] = React.useState(null);
      const [aiOpen, setAiOpen] = React.useState(false);
      const [aiTiles, setAiTiles] = React.useState([]);
      // Edit-mode state for dashboard tiles
      const [editingDash, setEditingDash] = React.useState(false);
      // Dashboard period filter (Year to date, Today, This week, …). Lifted to
      // App so tiles can read it via PeriodContext.
      const [period, setPeriod] = React.useState('Year to date');
      // Insights page filters (provider / type) — lifted so they can live in the topbar.
      const [insightProv, setInsightProv] = React.useState(null);
      const [insightType, setInsightType] = React.useState(null);
      // Client-detail (e.g. David Young profile) period + active sub-tab —
      // lifted so the period filter can live in the top header.
      const [clientPeriod, setClientPeriod] = React.useState('Year to date');
      const [clientTab, setClientTab] = React.useState('Profile');
      // Clients-table filters (slide-out drawer) + active-selections bar
      const [filterOpen, setFilterOpen] = React.useState(false);
      const [clientFilters, setClientFilters] = React.useState({});
      const CF_ICONS = { segment:'layer-group', aum:'building-columns', risk:'shield-halved', status:'circle-check' };
      const activeFilterChips = Object.entries(clientFilters).flatMap(([key, vals]) =>
        (vals || []).map(v => ({ key, value:v, label:v, icon: CF_ICONS[key] }))
      );
      const removeFilterChip = (key, value) => setClientFilters(prev => {
        const next = (prev[key] || []).filter(x => x !== value);
        const out = { ...prev }; if (next.length) out[key] = next; else delete out[key];
        return out;
      });
      const DEFAULT_TILE_ORDER = ['meetings','notifs','insights_tile','lifecycle','journal','watchtile','topclients','aum_alloc','billing','aum','holdings','cashflow','fees'];
      const [tileOrder, setTileOrder] = React.useState(() => {
        let arr = null;
        try { const s = JSON.parse(localStorage.getItem('adv.tile.order.v2')||'null'); if (Array.isArray(s) && s.length) arr = s; } catch(e) {}
        if (!arr) return DEFAULT_TILE_ORDER;
        // Migrate: insert any newly-added default tiles missing from a saved order.
        const out = [...arr];
        DEFAULT_TILE_ORDER.forEach((id, idx) => { if (!out.includes(id)) out.splice(Math.min(idx, out.length), 0, id); });
        return out;
      });
      const [hiddenTiles, setHiddenTiles] = React.useState(() => {
        try { const s = JSON.parse(localStorage.getItem('adv.tile.hidden')||'[]'); const set = new Set(s); set.delete('insights_tile'); return set; } catch(e) { return new Set(); }
      });
      // Per-tile display variant (e.g. aum_alloc: 'donut' | 'bar'). Driven by the
      // AI-edit drawer prompt — typing "bar chart" swaps the donut for bars.
      const [tileVariants, setTileVariants] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('adv.tile.variants')||'{}') || {}; } catch(e) { return {}; }
      });
      React.useEffect(() => { localStorage.setItem('adv.tile.variants', JSON.stringify(tileVariants)); }, [tileVariants]);
      const handleTileAiSubmit = React.useCallback(({ id, prompt }) => {
        const p = (prompt||'').toLowerCase();
        if (id === 'aum_alloc') {
          if (/\bbar\b/.test(p))                              setTileVariants(v => ({ ...v, aum_alloc: 'bar' }));
          else if (/\bdonut\b|\bpie\b|\bring\b/.test(p))      setTileVariants(v => ({ ...v, aum_alloc: 'donut' }));
        }
      }, []);
      React.useEffect(() => { localStorage.setItem('adv.tile.order.v2', JSON.stringify(tileOrder)); }, [tileOrder]);
      React.useEffect(() => { localStorage.setItem('adv.tile.hidden', JSON.stringify([...hiddenTiles])); }, [hiddenTiles]);
      // 'calendar' or one of the TileDetail kinds: aum_alloc, billing, aum, holdings, cashflow, fees
      const [detailRoute, setDetailRoute] = React.useState(null);
      // Halo Journal article route (opened from the Journal tile)
      const [journalArticle, setJournalArticle] = React.useState(null);
      const [notePost, setNotePost] = React.useState(null);
      React.useEffect(() => {
        const onJournal = (e) => { const { id } = e.detail || {}; if (id) { setNotePost(null); setJournalArticle(id); setActive(a => a === 'assistant' ? 'journals' : a); } };
        const onNote = (e) => { const { id } = e.detail || {}; if (id) { setJournalArticle(null); setNotePost(id); setActive(a => a === 'assistant' ? 'watchlist' : a); } };
        window.addEventListener('journal:open', onJournal);
        window.addEventListener('note:open', onNote);
        return () => { window.removeEventListener('journal:open', onJournal); window.removeEventListener('note:open', onNote); };
      }, []);
      // Client-profile tile detail (cd_networth, cd_allocation, cd_investment, cd_performance, cd_unrealized, cd_tax)
      const [clientDetailRoute, setClientDetailRoute] = React.useState(null);
      const [shareOpen, setShareOpen] = React.useState(false);
      const [dashboards, setDashboards] = React.useState([
        { id:'main',     name:'Main Dashboard',    active:true },
        { id:'clients',  name:'Client Performance' },
      ]);
      const [activeDash, setActiveDash] = React.useState('main');
      const [dashMenuOpen, setDashMenuOpen] = React.useState(false);
      const [creatingDash, setCreatingDash] = React.useState(false);
      const handleCreateDashboard = (name) => {
        const id = 'dash-' + Date.now();
        setDashboards(prev => [...prev, { id, name }]);
        setActiveDash(id);
        setCreatingDash(false);
      };
      // Cmd+K / Ctrl+K and 'tilebuilder:open' event open the AI tile builder
      React.useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
            e.preventDefault();
            setTcOpen(true);
          }
        };
        const onOpen = () => setTbOpen(true);
        window.addEventListener('keydown', onKey);
        window.addEventListener('tilebuilder:open', onOpen);
        return () => {
          window.removeEventListener('keydown', onKey);
          window.removeEventListener('tilebuilder:open', onOpen);
        };
      }, []);
      // Listen for client-tile detail open events from CDTile
      React.useEffect(() => {
        const onOpenClientTile = (e) => {
          const { kind } = e.detail || {};
          if (kind) setClientDetailRoute(kind);
        };
        window.addEventListener('clienttile:open', onOpenClientTile);
        return () => window.removeEventListener('clienttile:open', onOpenClientTile);
      }, []);
      // External "open this client + highlight an opportunity" trigger
      React.useEffect(() => {
        const onOpenClient = (e) => {
          const { client, highlight } = e.detail || {};
          setActive('clients');
          setSelectedClient(client || 'David Young');
          if (highlight) {
            setHighlightOpp(highlight);
            // auto-clear the highlight after 6s so it doesn't persist forever
            setTimeout(() => setHighlightOpp(null), 6000);
          }
        };
        window.addEventListener('client:open', onOpenClient);
        const onNavSet = (e) => {
          const { screen } = e.detail || {};
          if (screen) { setActive(screen); setSelectedClient(null); setHighlightOpp(null); setDetailRoute(null); setClientDetailRoute(null); setJournalArticle(null); setNotePost(null); }
        };
        window.addEventListener('nav:set', onNavSet);
        const onHaloScan = () => { setActive('insights'); setSelectedClient(null); setHighlightOpp(null); setDetailRoute(null); setClientDetailRoute(null); };
        const onConnOpen = () => setConnectionsOpen(true);
        window.addEventListener('insights:scan', onHaloScan);
        window.addEventListener('connections:open', onConnOpen);
        return () => {
          window.removeEventListener('client:open', onOpenClient);
          window.removeEventListener('nav:set', onNavSet);
          window.removeEventListener('insights:scan', onHaloScan);
          window.removeEventListener('connections:open', onConnOpen);
        };
      }, []);
      const go = (id) => { setActive(id); setSelectedClient(null); setHighlightOpp(null); setDetailRoute(null); setClientDetailRoute(null); setJournalArticle(null); setNotePost(null); };
      // onMore handler factory for tiles
      const handleMore = (kind) => () => {
        if (kind === 'topclients') { setActive('clients'); setDetailRoute(null); return; }
        if (kind === 'notifications') { setActive('notifications'); setDetailRoute(null); return; }
        if (kind === 'watchlist') { setActive('watchlist'); setDetailRoute(null); return; }
        if (kind === 'journals') { setActive('journals'); setDetailRoute(null); return; }
        if (kind === 'lifecycle') { setActive('lifecycle'); setDetailRoute(null); return; }
        setDetailRoute(kind);
      };
      const SIGN_OUT_HREF = "https://claude.ai/design/p/019dd4c5-78f0-71ea-8229-0ec671ae00aa?file=Demo%20Landing%20Page.html&present=1";
      return (
        <div style={{ display:'flex', minHeight:'100vh', background:'transparent' }}>
          <Sidebar
            items={nav}
            footerItems={NAV_FOOTER}
            user={{ name:'Avery Chen', role:'Senior Advisor' }}
            active={active}
            onSelect={(id) => {
              if (id === 'connections') { setConnectionsOpen(true); return; }
              go(id);
            }}
            brand="FIELD"
            defaultExpanded={true}
            signOutHref={SIGN_OUT_HREF}
            signOutLabel="Return to demo page"
            persistKey="adv.sb.expanded.v2"
            persistAccordionKey="adv.sb.accordion"
            onWidthChange={setSbWidth}
          />
          <div style={{ flex:1, minWidth:0, marginLeft: sbWidth + (sbWidth > 100 ? 24 : 0), display:'flex', flexDirection:'column', transition:'margin-left 220ms cubic-bezier(0.22, 0.61, 0.36, 1)' }}>
            <AdvisorTopbar
              active={active}
              selectedClient={selectedClient}
              clientDetailTitle={selectedClient && clientDetailRoute ? (TILE_DETAIL_CONFIG[clientDetailRoute]?.title || null) : null}
              onBack={selectedClient && clientDetailRoute
                ? (()=>setClientDetailRoute(null))
                : (()=>setSelectedClient(null))}
              dashboards={dashboards}
              activeDash={activeDash}
              setActiveDash={(id)=>{ setActiveDash(id); setCreatingDash(false); setDetailRoute(null); }}
              dashMenuOpen={dashMenuOpen}
              setDashMenuOpen={setDashMenuOpen}
              onCreateDashboardPage={()=>{ setCreatingDash(true); setDetailRoute(null); }}
              creatingDash={creatingDash}
              period={period}
              setPeriod={setPeriod}
              clientPeriod={clientPeriod}
              setClientPeriod={setClientPeriod}
              clientTab={clientTab}
              onOpenFilter={()=>setFilterOpen(true)}
              activeFilterChips={activeFilterChips}
              onRemoveFilterChip={removeFilterChip}
              onClearFilters={()=>setClientFilters({})}
              insightProv={insightProv}
              setInsightProv={setInsightProv}
              insightType={insightType}
              setInsightType={setInsightType}
            />
            {active === 'assistant' ? (
              <AdvisorAIPage
                onOpenClient={(name)=>window.dispatchEvent(new CustomEvent('client:open', { detail:{ client:name, highlight: name === 'David Young' ? 'rebalance' : null } }))}
                onOpenDeck={()=>window.open('advisor/Rebalance Deck - David Young.html', '_blank')}
                onNav={go}
              />
            ) : selectedClient && clientDetailRoute ? (
              <main style={{ flex:1, background:'transparent' }}>
                <TileDetail kind={clientDetailRoute} onBack={()=>setClientDetailRoute(null)} hideBack={true} />
              </main>
            ) : selectedClient ? (
              <main style={{ flex:1, background:'transparent' }}>
                <ClientDetail clientName={selectedClient} onBack={()=>{setSelectedClient(null); setHighlightOpp(null); setClientDetailRoute(null);}} highlightOpp={highlightOpp} tab={clientTab} onTabChange={setClientTab} period={clientPeriod} setPeriod={setClientPeriod} />
              </main>
            ) : notePost ? (
              <main style={{ flex:1, background:'transparent' }}>
                <NotePostPage noteId={notePost} onBack={()=>{ setNotePost(null); setActive('watchlist'); }} />
              </main>
            ) : journalArticle ? (
              <main style={{ flex:1, background:'transparent' }}>
                <JournalArticlePage articleId={journalArticle} onBack={()=>{ setJournalArticle(null); setActive('journals'); }} />
              </main>
            ) : active === 'watchlist' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <WatchlistPage />
              </main>
            ) : active === 'lifecycle' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <LifecyclePage />
              </main>
            ) : active === 'journals' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <JournalsPage />
              </main>
            ) : active === 'clients' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <ClientList onOpenClient={(name)=>setSelectedClient(name)} filters={clientFilters} />
              </main>
            ) : active === 'notifications' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <NotificationsPage />
              </main>
            ) : active === 'insights' ? (
              <InsightsPage provFilter={insightProv} typeFilter={insightType} onBuildProposal={(r)=>window.dispatchEvent(new CustomEvent('insight:open', { detail:{ id:r.id } }))} />
            ) : active.startsWith('practice') ? (
              <main style={{ flex:1, background:'transparent' }}>
                <MyPractice initialTab={
                  active === 'practice.cashflow' ? 'cashflow' :
                  active === 'practice.assets'   ? 'assets'   :
                  'clients'
                } onTabChange={(tabId)=>setActive('practice.'+tabId)} />
              </main>
            ) : (active === 'settings' || active === 'help') ? (
              <main style={{ flex:1, background:'transparent', padding:'48px 56px', color:'rgb(163,163,163)', fontFamily:'Inter' }}>
                <h2 style={{ fontFamily:'Inter', color:'rgb(249,250,251)', fontSize:22, fontWeight:600, margin:'0 0 8px' }}>
                  {active === 'settings' ? 'Settings' : 'Help & support'}
                </h2>
                <p style={{ fontSize:13, maxWidth:560, lineHeight:1.55 }}>
                  Placeholder route for the new <code>More</code> section in the sidebar. The dual-state component now
                  supports section grouping; the contents of these pages aren't part of this design pass.
                </p>
              </main>
            ) : creatingDash ? (
              <main style={{ flex:1, background:'transparent' }}>
                <NewDashboardPage
                  onCancel={()=>setCreatingDash(false)}
                  onCreate={handleCreateDashboard}
                />
              </main>
            ) : detailRoute === 'calendar' ? (
              <main style={{ flex:1, background:'transparent' }}>
                <CalendarView onBack={()=>setDetailRoute(null)} />
              </main>
            ) : detailRoute ? (
              <main style={{ flex:1, background:'transparent' }}>
                <TileDetail kind={detailRoute} onBack={()=>setDetailRoute(null)} />
              </main>
            ) : (
            <main style={{ flex:1, padding:'24px', background:'transparent' }}>
              <DashboardSecondaryMenu
                editing={editingDash}
                setEditing={setEditingDash}
                tileCount={tileOrder.filter(id=>!hiddenTiles.has(id)).length + aiTiles.length}
                onResetLayout={() => { setTileOrder(DEFAULT_TILE_ORDER); setHiddenTiles(new Set()); setTileVariants({}); }}
                onShare={() => setShareOpen(true)}
                onAddTile={() => { setEditTile(null); setTbOpen(true); }}
                period={period}
                setPeriod={setPeriod}
              />
              <PeriodContext.Provider value={period}>
              {(() => {
                const TILE_DEFS = {
                  meetings:   { cls:'col-3', el: <UpcomingMeetings onMore={handleMore('calendar')} />,      title:'Upcoming Meetings' },
                  notifs:     { cls:'col-3', el: <Notifications onMore={handleMore('notifications')} />,    title:'Notifications' },
                  lifecycle:  { cls:'col-6', el: <PortfolioLifecycle onMore={handleMore('lifecycle')} />, title:'Portfolio Lifecycle' },
                  journal:    { cls:'col-6', el: <JournalTile onMore={handleMore('journals')} />, title:'Journal' },
                  watchtile:  { cls:'col-6', el: <WatchlistTile onMore={handleMore('watchlist')} />, title:'Watchlist' },
                  insights_tile: { cls:'col-6', el: <InsightsTile onMore={()=>window.dispatchEvent(new CustomEvent('insights:scan'))} />, title:'Insights' },

    /* -- Edit-mode tile wrapper + helpers ---------------------------- */
    function reorderArr(arr, from, to) {
      if (from === to) return arr;
      const next = arr.slice();
      const [m] = next.splice(from, 1);
      next.splice(to, 0, m);
      return next;
    }
    function EditTile({ id, title, cls, editing, order, onMove, onRemove, children, onAiSubmit, onEditTile }) {
      const [over, setOver] = React.useState(false);
      const [menuOpen, setMenuOpen] = React.useState(false);
      const [aiOpen, setAiOpen] = React.useState(false);
      const [aiPrompt, setAiPrompt] = React.useState('');
      const [aiBusy, setAiBusy] = React.useState(false);
      const [aiDone, setAiDone] = React.useState(false);
      const ref = React.useRef();
      const menuRef = React.useRef();
      React.useEffect(() => {
        setMenuOpen(false);
        if (!editing) { setAiOpen(false); setAiDone(false); }
      }, [editing]);
      React.useEffect(() => {
        if (!menuOpen) return;
        const onDoc = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [menuOpen]);
      React.useEffect(() => {
        if (!aiOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setAiOpen(false); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [aiOpen]);
      const onDragStart = (e) => {
        if (!editing) return;
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
      };
      const onDragOver = (e) => {
        if (!editing) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setOver(true);
      };
      const onDragLeave = () => setOver(false);
      const onDrop = (e) => {
        e.preventDefault(); setOver(false);
        const src = e.dataTransfer.getData('text/plain');
        if (!src || src === id) return;
        const from = order.indexOf(src);
        const to = order.indexOf(id);
        if (from < 0 || to < 0) return;
        onMove(from, to);
      };
      const submitAi = async () => {
        if (!aiPrompt.trim()) return;
        setAiBusy(true);
        try {
          await new Promise(r => setTimeout(r, 900));
          if (window.claude && window.claude.complete) {
            await window.claude.complete(`Acknowledge tile edit request for "${title}": ${aiPrompt}. Respond with one short sentence.`).catch(()=>null);
          }
        } catch (e) {}
        setAiBusy(false); setAiDone(true);
        if (typeof onAiSubmit === 'function') {
          try { onAiSubmit({ id, title, prompt: aiPrompt }); } catch(e) {}
        }
        setTimeout(() => { setAiOpen(false); setAiPrompt(''); setAiDone(false); }, 1400);
      };
      return (
        <div
          ref={ref}
          className={`edit-tile ${cls} ${editing ? 'is-editing' : ''} ${over ? 'drop-target' : ''}`}
          draggable={editing}
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDragLeave={onDragLeave}
          onDrop={onDrop}
        >
          {(
            <div className="edit-menu-wrap" ref={menuRef} onMouseDown={(e)=>e.stopPropagation()}>
              {editing ? (
                <>
                  <button
                    className="edit-menu-btn ai"
                    data-tip="Edit"
                    aria-label="Edit"
                    onClick={(e)=>{ e.stopPropagation(); onEditTile ? onEditTile() : setAiOpen(true); }}
                  >
                    <i className="fa-solid fa-pen-to-square" style={{ fontSize:13 }} />
                  </button>
                  <button
                    className="edit-menu-btn danger"
                    data-tip="Delete"
                    aria-label="Delete"
                    onClick={(e)=>{ e.stopPropagation(); onRemove(); }}
                  >
                    <i className="fa-solid fa-trash-can" style={{ fontSize:13 }} />
                  </button>
                </>
              ) : (
                <>
                  <button
                    className="edit-menu-btn"
                    aria-label="More"
                    aria-haspopup="menu"
                    aria-expanded={menuOpen}
                    onClick={(e)=>{ e.stopPropagation(); setMenuOpen(o => !o); }}
                  >
                    <i className="fa-solid fa-ellipsis" style={{ fontSize:13 }} />
                  </button>
                  {menuOpen && (
                    <div className="edit-menu" role="menu">
                      <button
                        className="edit-menu-item"
                        role="menuitem"
                        onClick={(e)=>{ e.stopPropagation(); setMenuOpen(false); onEditTile ? onEditTile() : setAiOpen(true); }}
                      >
                        <span className="mi-ic"><i className="fa-solid fa-pen-to-square" style={{ fontSize:12 }} /></span>
                        Edit
                      </button>
                      <button
                        className="edit-menu-item danger"
                        role="menuitem"
                        onClick={(e)=>{ e.stopPropagation(); setMenuOpen(false); onRemove(); }}
                      >
                        <span className="mi-ic"><i className="fa-solid fa-trash-can" style={{ fontSize:12 }} /></span>
                        Delete
                      </button>
                    </div>
                  )}
                </>
              )}
            </div>
          )}
          {children}
          {aiOpen && ReactDOM.createPortal((
            <>
              <div className={`ai-drawer-backdrop ${aiOpen ? 'open' : ''}`} onClick={()=>setAiOpen(false)} />
              <div className={`ai-drawer ${aiOpen ? 'open' : ''}`} onMouseDown={(e)=>e.stopPropagation()}>
                <div className="ai-drawer-head">
                  <i className="fa-solid fa-wand-magic-sparkles" style={{ fontSize:14, color:'rgb(110,231,183)' }} />
                  <div style={{ fontFamily:'Inter', fontSize:14, fontWeight:600, color:'rgb(249,250,251)' }}>Edit "{title}"</div>
                  <div style={{ flex:1 }} />
                  <button onClick={()=>setAiOpen(false)} style={{ background:'transparent', border:'none', color:'rgb(163,163,163)', cursor:'pointer', width:28, height:28, borderRadius:8, display:'inline-flex', alignItems:'center', justifyContent:'center' }} aria-label="Close">
                    <i className="fa-solid fa-xmark" style={{ fontSize:13 }} />
                  </button>
                </div>
                <div className="ai-drawer-body">
                  {aiDone ? (
                    <div style={{ display:'flex', alignItems:'center', gap:10, padding:'14px 4px', fontFamily:'Inter', fontSize:13, color:'rgb(110,231,183)' }}>
                      <i className="fa-solid fa-circle-check" style={{ fontSize:14 }} /> Tile updated
                    </div>
                  ) : (
                    <>
                      <div style={{ fontFamily:'Inter', fontSize:11, fontWeight:600, color:'rgb(163,163,163)', textTransform:'uppercase', letterSpacing:0.4 }}>Describe your change</div>
                      <textarea
                        value={aiPrompt}
                        onChange={e=>setAiPrompt(e.target.value)}
                        placeholder={`How should "${title}" change?`}
                        rows={4}
                        autoFocus
                        style={{
                          width:'100%', resize:'vertical', minHeight:96,
                          background:'rgba(0,0,0,0.25)', border:'1px solid rgba(75,85,99,0.6)', borderRadius:10,
                          color:'rgb(249,250,251)', fontFamily:'Inter', fontSize:13, padding:'10px 12px', outline:'none', lineHeight:1.5,
                        }}
                      />
                      <div style={{ fontFamily:'Inter', fontSize:11, fontWeight:600, color:'rgb(163,163,163)', textTransform:'uppercase', letterSpacing:0.4, marginTop:4 }}>Try a prompt</div>
                      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                        {(id === 'aum_alloc' ? [
                          'Switch this to a bar chart',
                          'Switch back to a donut chart',
                          'Group results by sector',
                          'Highlight the top 3 movers',
                          'Make this more compact',
                        ] : [
                          'Switch this to a bar chart',
                          'Show me the last 90 days only',
                          'Group results by sector',
                          'Highlight the top 3 movers',
                          'Make this more compact',
                        ]).map(s => (
                          <button key={s} className="ai-prompt-chip" onClick={()=>setAiPrompt(s)}>{s}</button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
                {!aiDone && (
                  <div className="ai-drawer-foot">
                    <div style={{ flex:1 }} />
                    <button onClick={()=>setAiOpen(false)} style={{ height:32, padding:'0 14px', borderRadius:8, border:'1px solid rgb(75,85,99)', background:'transparent', color:'rgb(209,213,219)', fontFamily:'Inter', fontSize:12.5, fontWeight:500, cursor:'pointer' }}>Cancel</button>
                    <button onClick={submitAi} disabled={!aiPrompt.trim() || aiBusy} style={{
                      height:32, padding:'0 14px', borderRadius:8, border:'none',
                      background: aiPrompt.trim() && !aiBusy ? 'rgb(5,122,85)' : 'rgba(5,122,85,0.4)',
                      color:'#fff', fontFamily:'Inter', fontSize:12.5, fontWeight:600,
                      cursor: aiPrompt.trim() && !aiBusy ? 'pointer' : 'not-allowed',
                      display:'inline-flex', alignItems:'center', gap:6,
                    }}>
                      {aiBusy ? <><i className="fa-solid fa-spinner fa-spin" style={{ fontSize:12 }} /> Updating…</> : <><i className="fa-solid fa-wand-magic-sparkles" style={{ fontSize:12 }} /> Apply</>}
                    </button>
                  </div>
                )}
              </div>
            </>
          ), document.body)}
        </div>
      );
    }

    /* -- Period / date-range dropdown for the topbar -------------------- */
    function TopbarPeriod({ value, onChange }) {
      const [open, setOpen] = React.useState(false);
      const [internal, setInternal] = React.useState('Year to date');
      const period = value != null ? value : internal;
      const setPeriod = (p) => { if (onChange) onChange(p); else setInternal(p); };
      const ref = React.useRef();
      React.useEffect(() => {
        const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, []);
      const periods = ['Today','This week','This month','This quarter','Year to date','Last 12 months','All time'];
      return (
        <div style={{ position:'relative' }} ref={ref}>
          <TopbarButton variant="outline" onClick={()=>setOpen(o=>!o)}>
            <i className="fa-solid fa-calendar" style={{ width:12, height:12 }} />
            {period}
            <i className="fa-solid fa-chevron-down" style={{ fontSize:10, opacity:0.7, marginLeft:2 }} />
          </TopbarButton>
          {open && (
            <div style={{
              position:'absolute', top:'calc(100% + 6px)', right:0, minWidth:200, zIndex:50,
              background:'rgb(17,24,39)', border:'1px solid rgb(75,85,99)', borderRadius:10,
              boxShadow:'0 18px 40px -12px rgba(0,0,0,0.65)', padding:6,
            }}>
              {periods.map(p => (
                <button key={p} onClick={()=>{ setPeriod(p); setOpen(false); }} style={{
                  width:'100%', textAlign:'left', padding:'8px 10px', borderRadius:6, border:'none',
                  background: p===period?'rgba(5,122,85,0.18)':'transparent',
                  color:'rgb(229,231,235)', fontFamily:'Inter', fontSize:12.5, fontWeight: p===period?600:500,
                  cursor:'pointer', display:'flex', alignItems:'center', gap:8,
                }}>
                  <span style={{ flex:1 }}>{p}</span>
                  {p===period && <i className="fa-solid fa-check" style={{ width:11, height:11, color:'rgb(5,122,85)' }} />}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* -- Insights topbar filters (provider / type dropdowns) -------------- */
    function InsightFilterMenu({ label, value, options, onChange }) {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef();
      React.useEffect(() => {
        const f = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', f); return () => document.removeEventListener('mousedown', f);
      }, []);
      const cur = options.find(o => o.value === value);
      const active = value != null;
      return (
        <div ref={ref} style={{ position:'relative' }}>
          <button onClick={()=>setOpen(o=>!o)} style={{ height:32, padding:'0 12px', borderRadius:8, cursor:'pointer',
            border:`1px solid ${active?'rgb(5,122,85)':'rgb(75,85,99)'}`, background: active?'rgba(5,122,85,0.15)':'rgba(0,0,0,0.25)',
            color: active?'rgb(52,211,153)':'rgb(229,231,235)', fontFamily:'Inter', fontSize:12.5, fontWeight:500,
            display:'inline-flex', alignItems:'center', gap:8, whiteSpace:'nowrap' }}>
            {cur && cur.color && <span style={{ width:7, height:7, borderRadius:9999, background:cur.color }} />}
            {label}: {cur ? cur.label : 'All'}
            <i className="fa-solid fa-chevron-down" style={{ fontSize:9 }} />
          </button>
          {open && (
            <div style={{ position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:60, minWidth:210, maxHeight:340, overflowY:'auto', padding:6, borderRadius:10,
              background:'rgb(17,24,39)', border:'1px solid rgb(75,85,99)', boxShadow:'0 18px 40px -12px rgba(0,0,0,0.7)' }}>
              {[{ value:null, label:'All' }].concat(options).map(o => (
                <button key={String(o.value)} onClick={()=>{ onChange(o.value); setOpen(false); }} style={{ display:'flex', alignItems:'center', gap:9, width:'100%', padding:'8px 10px', borderRadius:6,
                  background: o.value===value ? 'rgba(5,122,85,0.16)' : 'transparent', border:'none', color:'rgb(229,231,235)', fontFamily:'Inter', fontSize:12.5, cursor:'pointer', textAlign:'left' }}
                  onMouseEnter={e=>{ if(o.value!==value) e.currentTarget.style.background='rgba(255,255,255,0.05)'; }}
                  onMouseLeave={e=>{ if(o.value!==value) e.currentTarget.style.background='transparent'; }}>
                  {o.color ? <span style={{ width:8, height:8, borderRadius:9999, background:o.color, flexShrink:0 }} /> : <span style={{ width:8 }} />}
                  <span style={{ flex:1 }}>{o.label}</span>
                  {o.value===value && <i className="fa-solid fa-check" style={{ fontSize:10, color:'rgb(52,211,153)' }} />}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }
    function InsightTopbarFilters({ prov, setProv, type, setType }) {

      const actionsWithDate = (
        <>
          {!hideDate && <span style={{ fontFamily:'Inter', fontSize:11.5, color:'rgb(163,163,163)', marginRight:4, whiteSpace:'nowrap' }}>{dateStr}</span>}
          {actions}
        </>
      );
      const isClients = active === 'clients' && !selectedClient;
      const showSelections = isClients && (activeFilterChips || []).length > 0;
      return (
        <Topbar
          title={titleNode}
          searchPlaceholder="Search by clients"
          onBack={selectedClient ? onBack : undefined}
          actions={actionsWithDate}
          activeSelections={showSelections
            ? activeFilterChips.map(c => ({ label:c.label, icon:c.icon, onRemove:()=>onRemoveFilterChip(c.key, c.value) }))
            : undefined}
          onClearAll={onClearFilters}
        />
      );
    }

    /* -- FAB ---------------------------------------------------------- */
    function AIFab({ onClick, hidden }) {
      const ref = React.useRef();
      const [hover, setHover] = React.useState(false);
      if (hidden) return null;
      return (
        <button
          ref={ref}
          onClick={onClick}
          onMouseEnter={()=>setHover(true)}
          onMouseLeave={()=>setHover(false)}
          title="Ask AI"
          style={{
            position:'fixed', right:24, bottom:24, zIndex:80,
            height:52, padding: hover ? '0 18px 0 14px' : 0, width: hover ? 'auto' : 52, minWidth:52,
            borderRadius:9999, border:'1px solid rgba(255,255,255,0.10)',
            background:'linear-gradient(135deg, rgb(5,122,85) 0%, rgb(20,160,120) 100%)',
            color:'#fff', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:10,
            boxShadow: hover
              ? '0 16px 40px -8px rgba(5,122,85,0.55), 0 0 0 6px rgba(5,122,85,0.18)'
              : '0 10px 25px -5px rgba(0,0,0,0.45), 0 0 0 4px rgba(5,122,85,0.22)',
            transition:'box-shadow 200ms ease, padding 200ms ease, width 200ms ease, transform 200ms ease',
            transform: hover ? 'translateY(-1px)' : 'translateY(0)',
            overflow:'hidden', whiteSpace:'nowrap',
          }}>
          <i className="fa-solid fa-wand-magic-sparkles" style={{ fontSize:16, flexShrink:0 }} />
          {hover && (
            <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:600 }}>Ask AI</span>
          )}
        </button>
      );
    }

    function InlineToast() {
      const [show, setShow] = React.useState(true);
      const ref = React.useRef();
      if (!show) return null;
      return (
        <div ref={ref} style={{
          position:'fixed', left:240, bottom:24, width:260,
          background:'rgba(255,255,255,0.05)', border:'1px solid rgb(75,85,99)', borderRadius:12,
          backdropFilter:'blur(12px) saturate(140%)', WebkitBackdropFilter:'blur(12px) saturate(140%)',
          padding:'12px 12px 10px', color:'rgb(249,250,251)',
          boxShadow:'0 10px 25px -5px rgba(0,0,0,0.4)',
        }}>
          <div style={{ display:'flex', alignItems:'flex-start', gap:8 }}>
            <i className="fa-solid fa-envelope" style={{ width:15, height:15, color:'rgb(5,122,85)', marginTop:2 }} />
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontFamily:'Inter', fontSize:12, fontWeight:600 }}>New Email from David Young</div>
              <div style={{ fontFamily:'Inter', fontSize:11, color:'rgb(163,163,163)' }}>Send latest investment selection</div>
            </div>
            <button onClick={()=>setShow(false)} style={{ background:'transparent', border:'none', color:'rgb(163,163,163)', cursor:'pointer', padding:2 }}>
              <i className="fa-solid fa-xmark" style={{ width:12, height:12 }} />
            </button>
          </div>
          <button style={{
            marginTop:8, width:'100%', height:28, borderRadius:8,
            background:'rgba(5,122,85,0.2)', border:'1px solid rgba(5,122,85,0.4)', color:'rgb(5,122,85)',
            fontFamily:'Inter', fontSize:11.5, fontWeight:500, cursor:'pointer',
          }}>View Notification</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
