    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }

    .scroll-thin::-webkit-scrollbar-thumb { background: rgba(75,85,99,0.5); border-radius: 9999px; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(75,85,99,0.5); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(107,114,128,0.7); }
    .glass-card {
      background: rgba(255,255,255,0.04);

      border-radius: 12px;
